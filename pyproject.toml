[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aruna"
version = "0.1.0"
description = "ARUNA AI - Market Research & Paper Trading Intelligence System (Crypto + IDX)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "asyncmy>=0.2.9",
    "httpx>=0.27",
    "redis>=5.2",
    "structlog>=24.4",
    "python-telegram-bot>=21.9",
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[project.scripts]
aruna = "aruna.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aruna = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live PostgreSQL and/or Redis instance",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE", "SLF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Tests reach into internals deliberately.
"tests/*" = ["SLF001"]
